name: Daily Robotics Learning Log

on:
  schedule:
    - cron: "20 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-progress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate learning log
        run: npm run daily

      - name: Run tests
        run: npm test -- --run

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/progress.json learning-log
          if git diff --cached --quiet; then
            echo "No learning-log changes today."
          else
            git commit -m "chore: add daily robotics learning log"
            git push
          fi

